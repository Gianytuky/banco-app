<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start">
        <div th:replace="~{fragments/layout :: encabezado('bi-people-fill', 'Clientes', 'Consulta y mantenimiento de clientes')}"></div>
        <a th:href="@{/clientes/nuevo}" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Nuevo cliente</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <!-- Busqueda -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/clientes}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="dni" class="form-label fw-semibold">Buscar por DNI</label>
                    <input type="text" id="dni" name="dni" class="form-control" th:value="${dni}" placeholder="Ej: 45678912" maxlength="8">
                </div>
                <div class="col-md-5">
                    <label for="nombre" class="form-label fw-semibold">Buscar por nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" th:value="${nombre}" placeholder="Ej: PARDO">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill"><i class="bi bi-search me-1"></i>Buscar</button>
                    <a th:href="@{/clientes}" class="btn btn-outline-secondary flex-fill">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold">
            <i class="bi bi-list-ul me-1"></i>Resultados
            <span class="badge text-bg-primary ms-2" th:text="${#lists.size(clientes)}">0</span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Código</th>
                    <th>DNI</th>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Dirección</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="7" class="text-center text-muted py-4">No se encontraron clientes</td>
                </tr>
                <tr th:each="c : ${clientes}">
                    <td><span class="badge text-bg-secondary" th:text="${c.cliCod}">C0001</span></td>
                    <td th:text="${c.cliDni}">45678912</td>
                    <td class="fw-semibold" th:text="${c.cliNom}">Nombre</td>
                    <td th:text="${c.cliTel}">987654321</td>
                    <td th:text="${c.cliEmail}">correo@example.com</td>
                    <td th:text="${c.cliDir}">Dirección</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/clientes/{cod}/editar(cod=${c.cliCod})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil-square me-1"></i>Editar</a>
                        <a th:href="@{/cuentas(dni=${c.cliDni})}" class="btn btn-sm btn-outline-success">
                            <i class="bi bi-credit-card me-1"></i>Cuentas</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
