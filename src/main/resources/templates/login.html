<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="bg-primary-subtle">

<div class="container min-vh-100 d-flex align-items-center">
    <div class="row justify-content-center w-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">

            <div class="text-center mb-4">
                <i class="bi bi-bank2 display-1 text-primary"></i>
                <h1 class="h3 fw-bold mt-2">Banco Demo</h1>
                <p class="text-muted">Sistema de Gestión Bancaria</p>
            </div>

            <div class="card border-0 shadow">
                <div class="card-body p-4">
                    <h2 class="h5 fw-bold mb-3 text-center">Iniciar sesión</h2>

                    <div th:if="${param.error}" class="alert alert-danger py-2">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>Usuario o contraseña incorrectos
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2">
                        <i class="bi bi-check-circle-fill me-2"></i>Sesión cerrada correctamente
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username"
                                       placeholder="admin" required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted small mt-3">Proyecto académico</p>
        </div>
    </div>
</div>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
