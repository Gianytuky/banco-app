spring.application.name=banco
server.port=8081

# ---------- Base de datos (XAMPP: MySQL en el puerto 3309 segun tu panel) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/bdbanco?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

# ---------- Correo Gmail ----------
# 1) Active la verificacion en 2 pasos en su cuenta Google
# 2) Cree una "Contrasena de aplicacion" (16 letras) y peguela abajo
# 3) Cambie app.mail.enabled a true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Tiempos maximos (ms) para que no se quede colgado si la red bloquea el puerto
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
# Si la red bloquea el puerto 587, pruebe: port=465, starttls.enable=false y agregue
# spring.mail.properties.mail.smtp.ssl.enable=true
app.mail.enabled=true

# ---------- API de consulta de DNI (apiperu.dev) ----------
app.dni.url=https://apiperu.dev/api/dni
app.dni.token=

# Los valores del archivo local reemplazan a los de ejemplo y no se suben al repositorio.
spring.config.import=optional:classpath:application-local.properties